name: Stable MQTT patch tests
on:
  push:
    branches: [upstream/stable-mqtt-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check exact upstream Stable archive
        run: |
          printf '%s  %s\n' ca803a3f8777efa75a40739d2efeb0362365ffa4291d3eb76d9a231c6cb53976 1.4.5_stable.tar.gz | sha256sum -c -
          mkdir -p /tmp/stable-src
          tar -xzf 1.4.5_stable.tar.gz -C /tmp/stable-src
          test -f /tmp/stable-src/main.py
      - name: Regression tests
        env:
          STABLE_ROOT: /tmp/stable-src
        run: python -m unittest discover -s tests -p 'test_stable_mqtt.py' -v
      - name: Dry run and apply on isolated copy
        run: |
          python patches/stable-mqtt.py --path /tmp/stable-src/main.py --diff
          python patches/stable-mqtt.py --path /tmp/stable-src/main.py --apply
          python patches/stable-mqtt.py --path /tmp/stable-src/main.py
      - name: Test real broker outage and reconnect
        env:
          STABLE_ROOT: /tmp/stable-src
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto
          python -m pip install 'paho-mqtt==1.6.1'
          python -m unittest discover -s tests -p 'test_stable_mqtt_broker.py' -v
