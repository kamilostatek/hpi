name: Stable GPIO patch tests
on:
  push:
    branches: [upstream/stable-gpio-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check exact upstream Stable archive
        run: |
          printf '%s  %s\n' ca803a3f8777efa75a40739d2efeb0362365ffa4291d3eb76d9a231c6cb53976 1.4.5_stable.tar.gz | sha256sum -c -
          mkdir -p /tmp/stable-src
          tar -xzf 1.4.5_stable.tar.gz -C /tmp/stable-src
          test -f /tmp/stable-src/main.py
          # Stable updates main.py but retains the original device GPIO module.
          mkdir -p /tmp/stable-src/HPi
          cp tests/fixtures/HPi/GPIO.py /tmp/stable-src/HPi/GPIO.py
      - name: Regression tests
        env:
          STABLE_ROOT: /tmp/stable-src
        run: python -m unittest discover -s tests -p 'test_stable_gpio.py' -v
      - name: Dry run and apply on isolated copy
        run: |
          python patches/stable-gpio.py --root /tmp/stable-src --diff
          python patches/stable-gpio.py --root /tmp/stable-src --apply
          python patches/stable-gpio.py --root /tmp/stable-src
